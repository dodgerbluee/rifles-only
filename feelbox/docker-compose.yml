name: rifles-feelbox

# Lobby (8080) lists the match. Game is internal and actually simulates it.
# Restarting `game` starts a fresh match. Browsers never host.
#   docker compose up --build
#   LAN: http://HOST_IP:8080
services:
  lobby:
    build: .
    ports:
      - "0.0.0.0:${FEELBOX_PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      ROLE: lobby
      GAME_STATIC: dist
      GAME_WS: ws://game:8081/ws
    restart: unless-stopped

  game:
    build: .
    environment:
      HOST: "0.0.0.0"
      PORT: "8081"
      ROLE: game
      LOBBY_URL: http://lobby:8080
      GAME_NAME: Last Wire
      GAME_ID: default
      # Optional: SERVER_CONFIG=/app/server.json
      GAME_MAP: wharf
      GAME_PER_TEAM: "5"
    expose:
      - "8081"
    depends_on:
      - lobby
    restart: unless-stopped
