<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knife pick — Rifles Only</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #121410;
        color: #e6dfd0;
        font: 13px/1.35 ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #view { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(220px, 1fr);
        grid-template-rows: auto 1fr auto;
      }
      header { grid-column: 1; }
      footer { grid-column: 2; grid-row: 1 / -1; }
      header, footer { pointer-events: auto; }
      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px 8px;
        background: linear-gradient(180deg, rgba(18, 20, 16, 0.92), transparent);
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      .meta { color: #b8b09c; max-width: 42rem; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button {
        appearance: none;
        border: 1px solid #5a5648;
        background: #24261f;
        color: #e6dfd0;
        padding: 6px 10px;
        border-radius: 3px;
        cursor: pointer;
      }
      button.on, button:hover { border-color: #c4b48a; background: #35362c; }
      footer {
        padding: 72px 12px 16px;
        display: flex;
        align-items: flex-end;
      }
      #picks {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(6, 1fr);
        gap: 6px;
        width: 100%;
        height: min(78vh, 720px);
      }
      #picks button {
        min-height: 0;
        text-align: left;
        padding: 8px;
        background: transparent;
        border-color: transparent;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      #picks button.on, #picks button:hover {
        background: rgba(53, 54, 44, 0.28);
        border-color: #c4b48a;
      }
      #picks .n {
        display: block;
        color: #8a8474;
        font-size: 11px;
      }
      #picks .name { display: block; font-weight: 650; }
      kbd {
        border: 1px solid #5a5648;
        border-bottom-width: 2px;
        border-radius: 3px;
        padding: 0 5px;
        font: 11px ui-monospace, monospace;
        color: #cfc6b0;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <header>
        <div>
          <h1 id="title">Knife pick</h1>
          <p id="blurb" class="meta"></p>
        </div>
        <div class="row">
          <button type="button" id="rest">Rest</button>
          <button type="button" id="slash">Slash</button>
          <span class="meta"><kbd>1</kbd>–<kbd>0</kbd> knives · <kbd>B</kbd> bat · <kbd>S</kbd> slash · drag orbit</span>
        </div>
      </header>
      <div></div>
      <footer>
        <div id="picks"></div>
      </footer>
    </div>
    <script type="module" src="/src/knife-pick.ts"></script>
  </body>
</html>
