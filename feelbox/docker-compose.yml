name: rifles-feelbox

# Lobby (8080) lists the match. Game is internal and actually simulates it.
# Restarting `game` starts a fresh match. Browsers never host.
# Logins live in ../data (repo ./data) so they survive rebuilds.
#   docker compose up --build
#   LAN: http://HOST_IP:8080
services:
  lobby:
    build: .
    ports:
      - "0.0.0.0:${FEELBOX_PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      ROLE: lobby
      GAME_STATIC: dist
      GAME_WS: ws://game:8081/ws
      DATA_DIR: /data
      ACCOUNTS_PATH: /data/accounts.json
    volumes:
      - ${FEELBOX_DATA:-../data}:/data
    restart: unless-stopped

  game:
    build: .
    environment:
      HOST: "0.0.0.0"
      PORT: "8081"
      ROLE: game
      LOBBY_URL: http://lobby:8080
      GAME_NAME: Last Wire
      GAME_ID: default
      # Optional: SERVER_CONFIG=/app/server.json
      GAME_MAP: wharf
      GAME_PER_TEAM: "5"
      DATA_DIR: /data
      ACCOUNTS_PATH: /data/accounts.json
    volumes:
      - ${FEELBOX_DATA:-../data}:/data
    expose:
      - "8081"
    depends_on:
      - lobby
    restart: unless-stopped
